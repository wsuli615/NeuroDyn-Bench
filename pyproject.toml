[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurodyn-bench"
version = "0.1.0"
description = "Executable, cost-aware diagnostic calibration benchmark for neural dynamics modeling"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "wsuli615" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "numba>=0.60",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "cma>=3.4",
    "optuna>=4.0",
    "pybind11>=2.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
